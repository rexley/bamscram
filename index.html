<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820"><meta name="description" content="Sixteen colorful, squishy dots. One endless physics playground.">
<title>Downhill — an endless dot playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ef7455'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#e6edf3;font-family:Arial,Helvetica,sans-serif}main{height:100svh;min-height:440px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;border-bottom:1px solid #a7c4d322;gap:16px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#ee7457}.subtitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;color:#a2b2bf}.controls{display:flex;gap:8px}button{border:1px solid #a7c4d344;background:transparent;color:#e6edf3;border-radius:24px;padding:12px 18px;cursor:pointer;font:600 13px Arial;min-height:44px}button:hover{background:#263543}button:focus-visible{outline:3px solid #e8973f;outline-offset:3px}#pause{background:#355e57;color:#fff;min-width:100px}.stage{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:22px;left:32px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a2b2bf}.distance{font-size:32px;font-weight:700;letter-spacing:-1px;margin:4px 0}.distance small{font-size:12px;font-weight:400;letter-spacing:0}.badge{position:absolute;right:32px;top:24px;font-size:11px;display:flex;align-items:center;gap:7px}.badge i{width:7px;height:7px;border-radius:50%;background:#8ec9a3}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0d141c99;pointer-events:none}#overlay span{background:#101820;padding:18px 28px;border-radius:30px;font-weight:bold}footer{display:flex;justify-content:space-between;gap:15px;padding:16px 32px;border-top:1px solid #a7c4d322;font-size:11px;color:#a2b2bf}.swatches{display:flex;gap:3px;align-items:center}.swatches i{height:7px;width:7px;border-radius:50%}@media(max-width:600px){header{padding:18px 18px}.brand{font-size:23px}.subtitle{font-size:8px;letter-spacing:1.5px}button{padding:10px 13px}#pause{min-width:82px}.hud{left:18px;top:18px}.badge{right:18px;top:20px}footer{padding:14px 18px;font-size:10px}.keyhint{display:none}.distance{font-size:25px}}
</style>
</head>
<body><main>
<header><div><div class="brand">downhill<span>↘</span></div><div class="subtitle">An endless dot playground</div></div><div class="controls"><button id="pause" aria-label="Pause simulation">Ⅱ Pause</button><button id="restart" aria-label="Restart simulation">↻ Restart</button></div></header>
<div class="stage"><canvas id="canvas" aria-label="16 colorful dots bouncing down an endless course of ramps and circular bumpers">Your browser needs Canvas support to display this simulation.</canvas><div class="hud"><div class="eyebrow">Distance traveled</div><div class="distance"><span id="distance">0</span> <small>m</small></div></div><div class="badge"><i></i><span id="status">16 dots · in motion</span></div><div id="overlay"><span>Taking a little breather.</span></div></div>
<footer><div class="swatches" id="swatches"></div><span>Gravity. A little chaos. Keep rolling.</span><span class="keyhint">Space to pause · R to restart</span></footer>
</main>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const colors=['#ee7457','#e8ae48','#6d9b80','#6e92b9','#b392b9','#e58eac','#4faaa3','#a5ad58','#d88b50','#829bd4','#ce716f','#98b886','#b6a1d0','#e6bf68','#6aacae','#db9674'];
const W=760,R=12,STEP=1/120;
let dots=[],obstacles=[],camera=-150,generated=0,seed=1,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,accumulator=0,last=0,viewW=760,viewH=650,scale=1,elapsed=0;
const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
function generate(){const horizon=camera+viewH+900;while(generated<horizon){const y=generated+300,flip=rand()>.5;const left=flip?85:425;obstacles.push({type:'ramp',x:left,y,x2:left+250,y2:y+115,r:10});obstacles.push({type:'ball',x:flip?565:200,y:y+150,r:32+rand()*16});obstacles.push({type:'ball',x:340+rand()*90,y:y+310,r:22+rand()*12});generated+=460;}obstacles=obstacles.filter(o=>Math.max(o.y,o.y2||o.y)+o.r>camera-550);}
function reset(){seed=70816;camera=-150;generated=0;elapsed=0;accumulator=0;dots=colors.map((color,i)=>({x:185+(i%8)*55,y:-85-Math.floor(i/8)*47,vx:(i%2?1:-1)*25,vy:0,r:R,color,squash:0,angle:0}));obstacles=[];generate();document.getElementById('distance').textContent='0';}
function impact(d,nx,ny,speed){if(speed>40){d.squash=Math.min(.3,speed/1800);d.angle=Math.atan2(ny,nx);}}
function collide(d,x,y,r){let dx=d.x-x,dy=d.y-y,dist=Math.hypot(dx,dy),overlap=d.r+r-dist;if(overlap<=0)return;let nx=dist>1e-6?dx/dist:0,ny=dist>1e-6?dy/dist:-1;d.x+=nx*overlap;d.y+=ny*overlap;let vn=d.vx*nx+d.vy*ny;if(vn<0){impact(d,nx,ny,-vn);d.vx-=1.78*vn*nx;d.vy-=1.78*vn*ny;let tangent=d.vx*(-ny)+d.vy*nx;d.vx+=ny*tangent*.055;d.vy-=nx*tangent*.055;}}
function step(dt){elapsed+=dt;for(const d of dots){d.vy+=640*dt;d.vx+=Math.sin(elapsed*.8+d.color.charCodeAt(1))*8*dt;d.vx*=Math.exp(-.075*dt);d.vy=Math.min(d.vy,690);d.x+=d.vx*dt;d.y+=d.vy*dt;d.squash*=Math.exp(-12*dt);if(d.x<35+d.r){d.x=35+d.r;impact(d,1,0,Math.abs(d.vx));d.vx=Math.abs(d.vx)*.82;}if(d.x>W-35-d.r){d.x=W-35-d.r;impact(d,-1,0,Math.abs(d.vx));d.vx=-Math.abs(d.vx)*.82;}for(const o of obstacles){if(Math.abs(o.y-d.y)>330)continue;if(o.type==='ball')collide(d,o.x,o.y,o.r);else{const ax=o.x2-o.x,ay=o.y2-o.y,t=Math.max(0,Math.min(1,((d.x-o.x)*ax+(d.y-o.y)*ay)/(ax*ax+ay*ay)));collide(d,o.x+t*ax,o.y+t*ay,o.r);}}}
for(let pass=0;pass<2;pass++)for(let i=0;i<dots.length;i++)for(let j=i+1;j<dots.length;j++){let a=dots[i],b=dots[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),overlap=a.r+b.r-dist;if(overlap>0){const nx=dist>1e-6?dx/dist:1,ny=dist>1e-6?dy/dist:0;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){let impulse=-vn*.88;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;impact(a,nx,ny,-vn);impact(b,nx,ny,-vn);}}}
const sorted=dots.map(d=>d.y).sort((a,b)=>a-b),target=(sorted[7]+sorted[8])/2-viewH*.36;camera+=Math.max(0,target-camera)*(1-Math.exp(-2.8*dt));
// Return stragglers to the visible stream without adding or removing particles.
for(const d of dots)if(d.y<camera-180||d.y>camera+viewH+230){d.x=95+rand()*570;d.y=camera-60-rand()*90;d.vx=(rand()-.5)*100;d.vy=150;d.squash=0;}
generate();}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);scale=Math.min(rect.width/W,1.3);viewW=rect.width/scale;viewH=rect.height/scale;ctx.setTransform(dpr*scale,0,0,dpr*scale,rect.width*dpr/2-W*dpr*scale/2,0);generate();}
function draw(){ctx.save();ctx.clearRect((W-viewW)/2,0,viewW,viewH);ctx.translate(0,-camera);ctx.fillStyle='#283742';for(let y=Math.floor(camera/80)*80;y<camera+viewH;y+=80)for(let x=60;x<W;x+=80){ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='#344652';ctx.lineWidth=2;for(const x of [35,W-35]){ctx.beginPath();ctx.moveTo(x,camera);ctx.lineTo(x,camera+viewH);ctx.stroke();}ctx.font='11px Arial';ctx.fillStyle='#93a9b7';for(let y=Math.ceil(camera/1000)*1000;y<camera+viewH;y+=1000){ctx.fillText(String(y/10)+' m',49,y-10);ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(W-45,y);ctx.stroke();ctx.setLineDash([]);}for(const o of obstacles){if(o.type==='ball'){ctx.fillStyle='#2d454b';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#668e8c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.x,o.y,o.r-7,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#668e8c';ctx.beginPath();ctx.arc(o.x,o.y,3,0,Math.PI*2);ctx.fill();}else{ctx.lineCap='round';ctx.strokeStyle='#527c73';ctx.lineWidth=o.r*2;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.strokeStyle='#8eb8a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+8,o.y);ctx.lineTo(o.x2-8,o.y2-7);ctx.stroke();}}for(const d of dots){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.angle);const stretch=1-d.squash;ctx.scale(stretch,1/stretch);ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff70';ctx.beginPath();ctx.arc(-3,-4,3,0,Math.PI*2);ctx.fill();ctx.restore();}ctx.restore();document.getElementById('distance').textContent=Math.floor(Math.max(0,camera+150)/10).toLocaleString();}
function syncPause(){document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';document.getElementById('pause').setAttribute('aria-label',paused?'Resume simulation':'Pause simulation');document.getElementById('overlay').style.display=paused?'flex':'none';document.getElementById('status').textContent=paused?'16 dots · resting':'16 dots · in motion';}
function toggle(){paused=!paused;accumulator=0;syncPause();}
document.getElementById('pause').onclick=toggle;document.getElementById('restart').onclick=()=>{reset();draw();};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.key.toLowerCase()==='r'){reset();draw();}});document.addEventListener('visibilitychange',()=>{last=0;accumulator=0;});
for(const color of colors){const el=document.createElement('i');el.style.background=color;document.getElementById('swatches').append(el);}new ResizeObserver(resize).observe(canvas);
reset();resize();syncPause();function frame(now){const delta=last?Math.min((now-last)/1000,.1):0;last=now;if(!paused&&!document.hidden){accumulator+=delta;while(accumulator>=STEP){step(STEP);accumulator-=STEP;}}draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
