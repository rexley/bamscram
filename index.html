<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820"><meta name="description" content="One hundred colorful, squishy dots. One endless physics playground.">
<title>Downhill — an endless dot playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ef7455'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#e6edf3;font-family:Arial,Helvetica,sans-serif}main{height:100svh;min-height:440px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:24px 32px;border-bottom:1px solid #a7c4d322;gap:16px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#ee7457}.subtitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;color:#a2b2bf}.controls{display:flex;gap:8px}button{border:1px solid #a7c4d344;background:transparent;color:#e6edf3;border-radius:24px;padding:12px 18px;cursor:pointer;font:600 13px Arial;min-height:44px}button:hover{background:#263543}button:focus-visible{outline:3px solid #e8973f;outline-offset:3px}#pause{background:#355e57;color:#fff;min-width:100px}.stage{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:22px;left:32px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a2b2bf}.distance{font-size:32px;font-weight:700;letter-spacing:-1px;margin:4px 0}.distance small{font-size:12px;font-weight:400;letter-spacing:0}.badge{position:absolute;right:32px;top:24px;font-size:11px;display:flex;align-items:center;gap:7px}.badge i{width:7px;height:7px;border-radius:50%;background:#8ec9a3}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0d141c99;pointer-events:none}#overlay span{background:#101820;padding:18px 28px;border-radius:30px;font-weight:bold}footer{display:flex;justify-content:space-between;gap:15px;padding:16px 32px;border-top:1px solid #a7c4d322;font-size:11px;color:#a2b2bf}.swatches{display:flex;gap:3px;align-items:center}.swatches i{height:7px;width:7px;border-radius:50%}@media(max-width:600px){header{padding:18px 18px}.brand{font-size:23px}.subtitle{font-size:8px;letter-spacing:1.5px}button{padding:10px 13px}#pause{min-width:82px}.hud{left:18px;top:18px}.badge{right:18px;top:20px}footer{padding:14px 18px;font-size:10px}.keyhint{display:none}.distance{font-size:25px}}
</style>
</head>
<body><main>
<header><div><div class="brand">downhill<span>↘</span></div><div class="subtitle">An endless dot playground</div></div><div class="controls"><button id="pause" aria-label="Pause simulation">Ⅱ Pause</button><button id="restart" aria-label="Restart simulation">↻ Restart</button></div></header>
<div class="stage"><canvas id="canvas" aria-label="Colorful dots navigating ramps, bumpers, and deadly smashers">Your browser needs Canvas support to display this simulation.</canvas><div class="hud"><div class="eyebrow">Distance traveled</div><div class="distance"><span id="distance">0</span> <small>m</small></div></div><div class="badge"><i></i><span id="status">100 dots · in motion</span></div><div id="overlay"><span>Taking a little breather.</span></div></div>
<footer><div class="swatches" id="swatches"></div><span>Red smashers are active. Dodge the shots.</span><span class="keyhint">Space to pause · R to restart</span></footer>
</main>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const colors=['#ee7457','#e8ae48','#6d9b80','#6e92b9','#b392b9','#e58eac','#4faaa3','#a5ad58','#d88b50','#829bd4','#ce716f','#98b886','#b6a1d0','#e6bf68','#6aacae','#db9674'];
const START_COUNT=100;
const W=760,R=12,STEP=1/240;
let hazards=[],shots=[],blasts=[],sparks=[],eliminated=0;
let dots=[],obstacles=[],camera=-150,generated=0,seed=1,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,accumulator=0,last=0,viewW=760,viewH=650,scale=1,elapsed=0;
const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
function generate(){const horizon=camera+viewH+900;while(generated<horizon){const y=generated+300,flip=rand()>.5;const length=130+rand()*230,angle=(.2+rand()*.65)*(rand()<.5?-1:1),dx=Math.cos(angle)*length,dy=Math.sin(angle)*length,left=65+rand()*(W-130-dx);obstacles.push({type:'ramp',x:left,y:y-dy/2,x2:left+dx,y2:y+dy/2,r:10});obstacles.push({type:'ball',x:flip?565:200,y:y+150,r:32+rand()*16});obstacles.push({type:'ball',x:340+rand()*90,y:y+310,r:22+rand()*12});if(rand()<.78){const types=['spikes','club','jabber','shooter'];hazards.push({type:types[Math.floor(rand()*4)],x:rand()<.5?35:W-35,y:y+245,phase:rand()*Math.PI*2,face:Math.floor(rand()*5),cooldown:1+rand()*2});}generated+=460;}obstacles=obstacles.filter(o=>Math.max(o.y,o.y2||o.y)+o.r>camera-550);}
function reset(){hazards=[];shots=[];blasts=[];sparks=[];eliminated=0;seed=70816;camera=-150;generated=0;elapsed=0;accumulator=0;dots=Array.from({length:START_COUNT},(_,i)=>({x:95+(i%20)*30,y:-110+Math.floor(i/20)*30,vx:(i%2?1:-1)*25,vy:0,r:R,color:colors[i%colors.length],squash:0,angle:0}));obstacles=[];generate();syncPause();document.getElementById('distance').textContent='0';}
function impact(d,nx,ny,speed){if(speed>40){d.squash=Math.min(.3,speed/1800);d.angle=Math.atan2(ny,nx);}}
function collide(d,x,y,r){let dx=d.x-x,dy=d.y-y,dist=Math.hypot(dx,dy),overlap=d.r+r-dist;if(overlap<=0)return;let nx=dist>1e-6?dx/dist:0,ny=dist>1e-6?dy/dist:-1;d.x+=nx*overlap;d.y+=ny*overlap;let vn=d.vx*nx+d.vy*ny;if(vn<0){impact(d,nx,ny,-vn);d.vx-=1.78*vn*nx;d.vy-=1.78*vn*ny;let tangent=d.vx*(-ny)+d.vy*nx;d.vx+=ny*tangent*.055;d.vy-=nx*tangent*.055;}}
function step(dt){if(!dots.length){updateEffects(dt);return;}elapsed+=dt;for(const d of dots){d.vy+=640*dt;d.vx+=Math.sin(elapsed*.8+d.color.charCodeAt(1))*8*dt;d.vx*=Math.exp(-.075*dt);d.vy=Math.min(d.vy,690);d.x+=d.vx*dt;d.y+=d.vy*dt;d.squash*=Math.exp(-12*dt);if(d.x<35+d.r){d.x=35+d.r;impact(d,1,0,Math.abs(d.vx));d.vx=Math.abs(d.vx)*.82;}if(d.x>W-35-d.r){d.x=W-35-d.r;impact(d,-1,0,Math.abs(d.vx));d.vx=-Math.abs(d.vx)*.82;}for(const o of obstacles){if(Math.abs(o.y-d.y)>330)continue;if(o.type==='ball')collide(d,o.x,o.y,o.r);else{const ax=o.x2-o.x,ay=o.y2-o.y,t=Math.max(0,Math.min(1,((d.x-o.x)*ax+(d.y-o.y)*ay)/(ax*ax+ay*ay)));collide(d,o.x+t*ax,o.y+t*ay,o.r);}}}
for(let pass=0;pass<2;pass++)for(let i=0;i<dots.length;i++)for(let j=i+1;j<dots.length;j++){let a=dots[i],b=dots[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),overlap=a.r+b.r-dist;if(overlap>0){const nx=dist>1e-6?dx/dist:1,ny=dist>1e-6?dy/dist:0;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){let impulse=-vn*.88;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;impact(a,nx,ny,-vn);impact(b,nx,ny,-vn);}}}
updateHazards(dt);
if(!dots.length){syncPause();return;}
const sorted=dots.map(d=>d.y).sort((a,b)=>a-b),target=sorted[Math.floor(sorted.length/2)]-viewH*.36;camera+=Math.max(0,target-camera)*(1-Math.exp(-2.8*dt));
// The viewport floor retains the original particles; eliminated dots never return.
const floor=camera+viewH-14;
for(const d of dots)if(d.y+d.r>floor){d.y=floor-d.r;if(d.vy>0){impact(d,0,-1,d.vy);d.vy=-d.vy*.82;d.vx*=.96;}}
generate();hazards=hazards.filter(h=>h.y>camera-550);}
function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);scale=Math.min(rect.width/W,1.3);viewW=rect.width/scale;viewH=rect.height/scale;ctx.setTransform(dpr*scale,0,0,dpr*scale,rect.width*dpr/2-W*dpr*scale/2,0);generate();}
function hazardShape(h){const dir=h.x<W/2?1:-1,wave=(Math.sin(elapsed*2.1+h.phase)+1)/2;
 if(h.type==='shooter')return {x:h.x,y:h.y,r:0,active:(h.firing||0)>0};
 if(h.type==='club')return {x:h.x+dir*(48+wave*125),y:h.y+Math.cos(elapsed*2.1+h.phase)*75,r:48,active:wave>.94};
 const extension=h.type==='spikes'?42+Math.pow(wave,12)*60:30+Math.pow(wave,12)*180;
 return {x:h.x+dir*extension,y:h.y,r:h.type==='spikes'?30:28,active:wave>.95};}
function destroy(d){if(d.dead)return;d.dead=true;eliminated++;blasts.push({x:d.x,y:d.y,life:1.15,color:d.color});for(let i=0;i<80;i++){const angle=Math.random()*Math.PI*2,speed=100+Math.random()*420;sparks.push({x:d.x,y:d.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1+Math.random()*.6,maxLife:1.6,size:3+Math.random()*8,color:i%3?d.color:'#ffd783'});}}
function updateEffects(dt){for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-1.3*dt);p.vy+=70*dt;p.life-=dt;}sparks=sparks.filter(p=>p.life>0);for(const b of blasts)b.life-=dt;blasts=blasts.filter(b=>b.life>0);}
// Circle-versus-polygon contact follows each rendered head, housing and shaft.
function segmentDistance(x,y,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(x-ax-t*dx,y-ay-t*dy);}
function polygonContact(x,y,r,points){let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const [ax,ay]=points[j],[bx,by]=points[i];if(segmentDistance(x,y,ax,ay,bx,by)<=r+1.5)return true;if((ay>y)!==(by>y)&&x<(bx-ax)*(y-ay)/(by-ay)+ax)inside=!inside;}return inside;}
function hazardContact(d,h,q){const dir=h.x<W/2?1:-1,x=(d.x-h.x)*dir,y=d.y-h.y,hx=(q.x-h.x)*dir,hy=q.y-h.y;
 const poly=p=>polygonContact(x,y,d.r,p),rect=(a,b,w,t)=>poly([[a,b],[a+w,b],[a+w,b+t],[a,b+t]]);
 if(rect(-22,-65,54,130))return true;
 if(h.type==='shooter')return rect(18,-34,62,68)||rect(65,-20,37,40);
 if(h.type==='spikes'){for(let i=-1;i<=1;i++)if(poly([[20,i*31-17],[hx+30,i*27],[20,i*31+17]]))return true;return false;}
 if(segmentDistance(x,y,22,0,hx,hy)<=d.r+(h.type==='club'?9.5:13.5))return true;
 if(h.type==='jabber')return poly([[hx+28,hy],[hx-18,hy-33],[hx-7,hy],[hx-18,hy+33]]);
 return poly(Array.from({length:24},(_,i)=>{const a=i*Math.PI/12,r=i%2?39:57;return [hx+Math.cos(a)*r,hy+Math.sin(a)*r];}));}
function pixelFace(x,y,variant,size=4){const faces=[['1100011','1100011','0011100','0111110','0100010'],['1110111','0100010','0000000','0111110','0101010'],['1100011','0100010','0001000','0011100','0110110'],['1110111','1000001','0011100','0100010','0011100'],['0100010','1110111','0000000','0111110','0010100']];ctx.fillStyle='#161622';ctx.fillRect(x-size*4.5,y-size*3.5,size*9,size*7);ctx.fillStyle='#b7ed8b';faces[variant%faces.length].forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1')ctx.fillRect(x+(i-3.5)*size,y+(j-2.5)*size,size,size);}));}
function updateHazards(dt){for(const h of hazards){if(h.y<camera-100||h.y>camera+viewH+150)continue;
 if(h.type==='shooter'){h.firing=Math.max(0,(h.firing||0)-dt);h.cooldown-=dt;if(h.cooldown<=0){const dir=h.x<W/2?1:-1;shots.push({x:h.x+dir*95,y:h.y,vx:dir*420,life:1.4});h.cooldown=2+rand()*2;h.firing=.3;}}
 const q=hazardShape(h);if(q.active)for(const d of dots)if(hazardContact(d,h,q))destroy(d);}
 for(const b of shots){b.x+=b.vx*dt;b.life-=dt;for(const d of dots)if(Math.hypot(d.x-b.x,d.y-b.y)<d.r+9){destroy(d);b.life=0;break;}}
 shots=shots.filter(b=>b.life>0&&b.x>30&&b.x<W-30&&b.y>camera-100);
 updateEffects(dt);
 const before=dots.length;dots=dots.filter(d=>!d.dead);if(dots.length!==before)syncPause();}
function drawHazards(){for(const h of hazards){const q=hazardShape(h),dir=h.x<W/2?1:-1;
 ctx.save();ctx.translate(h.x,h.y);ctx.scale(dir,1);ctx.fillStyle=q.active?'#642d43':'#312d3a';ctx.strokeStyle=q.active?'#ff667a':'#685462';ctx.lineWidth=3;ctx.fillRect(-22,-65,54,130);ctx.strokeRect(-22,-65,54,130);
 ctx.fillStyle='#e6af57';for(let i=-48;i<60;i+=24){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(16,i+10);ctx.lineTo(16,i+19);ctx.lineTo(0,i+9);ctx.fill();}
 ctx.strokeStyle=q.active?'#ff667a':'#795464';ctx.fillStyle=q.active?'#d74a65':'#644151';
 if(h.type==='shooter'){ctx.fillStyle='#533748';ctx.fillRect(18,-34,62,68);ctx.strokeRect(18,-34,62,68);ctx.fillStyle='#9c5368';ctx.fillRect(65,-20,35,40);ctx.fillStyle='#171820';ctx.fillRect(90,-14,12,28);ctx.fillStyle=q.active?'#ff667a':h.cooldown<.6?'#ffcd70':'#795464';ctx.fillRect(30,-17,25,8);ctx.fillRect(30,9,25,8);}
 else if(h.type==='spikes'){const reach=(q.x-h.x)*dir;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(20,i*31-17);ctx.lineTo(reach+30,i*27);ctx.lineTo(20,i*31+17);ctx.closePath();ctx.fill();ctx.stroke();}}
 else{const x=(q.x-h.x)*dir,y=q.y-h.y;ctx.lineCap='round';ctx.lineWidth=h.type==='club'?19:27;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(x,y);ctx.stroke();ctx.lineWidth=3;
 if(h.type==='club'){ctx.beginPath();for(let i=0;i<24;i++){const angle=i*Math.PI/12,r=i%2?39:57;const px=x+Math.cos(angle)*r,py=y+Math.sin(angle)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#251c2a';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8891';ctx.fillRect(x-14,y-7,9,6);ctx.fillRect(x+5,y-7,9,6);}
 else{ctx.beginPath();ctx.moveTo(x+28,y);ctx.lineTo(x-18,y-33);ctx.lineTo(x-7,y);ctx.lineTo(x-18,y+33);ctx.closePath();ctx.fill();ctx.stroke();}}
 const fx=h.type==='club'?(q.x-h.x)*dir:h.type==='shooter'?49:9,fy=h.type==='club'?q.y-h.y:0;pixelFace(fx,fy,h.face??0,h.type==='club'?4:3);
 ctx.restore();}
 ctx.fillStyle='#ffbd62';for(const b of shots){ctx.fillRect(b.x-Math.sign(b.vx)*26,b.y-4,Math.sign(b.vx)*26,8);ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();}}
function drawEffects(){for(const b of blasts){const t=1-b.life/1.15;ctx.globalAlpha=(1-t)*.65;ctx.strokeStyle=b.color;ctx.lineWidth=18*(1-t)+2;ctx.beginPath();ctx.arc(b.x,b.y,18+t*220,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=(1-t)*.28;ctx.fillStyle='#ffbc68';ctx.beginPath();ctx.arc(b.x,b.y,12+t*115,0,Math.PI*2);ctx.fill();}for(const p of sparks){ctx.globalAlpha=Math.min(1,p.life/.6);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;}
function draw(){ctx.save();ctx.clearRect((W-viewW)/2,0,viewW,viewH);ctx.translate(0,-camera);ctx.fillStyle='#283742';for(let y=Math.floor(camera/80)*80;y<camera+viewH;y+=80)for(let x=60;x<W;x+=80){ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='#344652';ctx.lineWidth=2;for(const x of [35,W-35]){ctx.beginPath();ctx.moveTo(x,camera);ctx.lineTo(x,camera+viewH);ctx.stroke();}ctx.font='11px Arial';ctx.fillStyle='#93a9b7';for(let y=Math.ceil(camera/1000)*1000;y<camera+viewH;y+=1000){ctx.fillText(String(y/10)+' m',49,y-10);ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(W-45,y);ctx.stroke();ctx.setLineDash([]);}for(const o of obstacles){if(o.type==='ball'){ctx.fillStyle='#2d454b';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#668e8c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.x,o.y,o.r-7,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#668e8c';ctx.beginPath();ctx.arc(o.x,o.y,3,0,Math.PI*2);ctx.fill();}else{ctx.lineCap='round';ctx.strokeStyle='#527c73';ctx.lineWidth=o.r*2;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x2,o.y2);ctx.stroke();ctx.strokeStyle='#8eb8a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+8,o.y);ctx.lineTo(o.x2-8,o.y2-7);ctx.stroke();}}ctx.strokeStyle='#668e8c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(35,camera+viewH-14);ctx.lineTo(W-35,camera+viewH-14);ctx.stroke();drawHazards();for(const d of dots){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.angle);const stretch=1-d.squash;ctx.scale(stretch,1/stretch);ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff70';ctx.beginPath();ctx.arc(-3,-4,3,0,Math.PI*2);ctx.fill();ctx.restore();}drawEffects();ctx.restore();document.getElementById('distance').textContent=Math.floor(Math.max(0,camera+150)/10).toLocaleString();}
function syncPause(){document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';document.getElementById('pause').setAttribute('aria-label',paused?'Resume simulation':'Pause simulation');document.getElementById('overlay').style.display=paused||!dots.length?'flex':'none';document.querySelector('#overlay span').textContent=!dots.length?'All dots eliminated. Restart for another run.':'Taking a little breather.';document.getElementById('status').textContent=dots.length+' / '+START_COUNT+' surviving · '+eliminated+' eliminated';}

function toggle(){paused=!paused;accumulator=0;syncPause();}
document.getElementById('pause').onclick=toggle;document.getElementById('restart').onclick=()=>{reset();draw();};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle();}if(e.key.toLowerCase()==='r'){reset();draw();}});document.addEventListener('visibilitychange',()=>{last=0;accumulator=0;});
for(const color of colors){const el=document.createElement('i');el.style.background=color;document.getElementById('swatches').append(el);}new ResizeObserver(resize).observe(canvas);
reset();resize();syncPause();function frame(now){const delta=last?Math.min((now-last)/1000,.1):0;last=now;if(!paused&&!document.hidden){accumulator+=delta;while(accumulator>=STEP){step(STEP);accumulator-=STEP;}}draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
